name: Build Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build Mobile and TV Release Modules
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

    - name: Generate Gradle Wrapper if Missing
      run: |
        if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Gradle wrapper not found. Generating wrapper..."
          gradle wrapper
        fi
        if ! unzip -t gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
          echo "Gradle wrapper jar is corrupt. Regenerating..."
          rm -f gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Decode Release Keystore
      run: |
        if [ -n "${{ secrets.Release_Key }}" ]; then
          echo "${{ secrets.Release_Key }}" | base64 --decode > release.keystore
        elif [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > release.keystore
        elif [ -f "debug.keystore" ]; then
          cp debug.keystore release.keystore
        else
          keytool -genkey -v -keystore release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build and Sign Mobile, TV, and Remote Audio Release APKs
      run: ./gradlew :mobile:assembleRelease :tv:assembleRelease :remoteaudio:assembleRelease --parallel --build-cache --configure-on-demand --no-daemon -x test -x lint
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        KEY_ALIAS: my_release_key
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'Aryan@2026' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'Aryan@2026' }}

    - name: Verify Release APK Sizes
      run: |
        echo "=== Generated Release APK Sizes ==="
        ls -lh mobile/build/outputs/apk/release/*.apk tv/build/outputs/apk/release/*.apk remoteaudio/build/outputs/apk/release/*.apk || true
        echo "=== Validating Release APK sizes ==="
        for apk in mobile/build/outputs/apk/release/*.apk tv/build/outputs/apk/release/*.apk remoteaudio/build/outputs/apk/release/*.apk; do
          if [ -f "$apk" ]; then
            size_kb=$(du -k "$apk" | cut -f1)
            size_mb=$(awk "BEGIN {printf \"%.2f\", $size_kb/1024}")
            echo "$apk size: ${size_mb} MB (${size_kb} KB)"
            # Mobile and RemoteAudio modules are lightweight (<10MB).
            # TV client includes native LibVLC multimedia engine with universal codecs (optimized under 25MB).
            max_kb=10240
            if [[ "$apk" == *"tv"* ]]; then
              max_kb=75000
            fi
            if [ "$size_kb" -gt "$max_kb" ]; then
              echo "ERROR: $apk is ${size_mb} MB which exceeds the limit (${max_kb} KB)!"
              exit 1
            fi
          fi
        done
        echo "SUCCESS: All Release APK sizes verified within limits!"

    - name: Upload Mobile Release APK
      uses: actions/upload-artifact@v4
      with:
        name: mobile-stream-server-release
        path: mobile/build/outputs/apk/release/mobile-release.apk

    - name: Upload TV Release APK
      uses: actions/upload-artifact@v4
      with:
        name: tv-stream-client-release
        path: tv/build/outputs/apk/release/tv-release.apk

    - name: Upload Remote Audio Release APK
      uses: actions/upload-artifact@v4
      with:
        name: remote-audio-client-release
        path: remoteaudio/build/outputs/apk/release/remoteaudio-release.apk
